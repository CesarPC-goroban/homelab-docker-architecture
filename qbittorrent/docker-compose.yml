services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=WEBUI_PORT
    volumes:
      - ./config:/config
      - /mnt/DiscoComplementario/descargas:/downloads
    ports:
      - PuertoLocal:WEBUI_PORT
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped