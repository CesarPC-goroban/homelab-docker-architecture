#Seagate Barracuda de 3 TB.
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=9448
    volumes:
      - ./config:/config
      - /mnt/kenabeek/descargas:/downloads
    ports:
      - 8448:9448
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
