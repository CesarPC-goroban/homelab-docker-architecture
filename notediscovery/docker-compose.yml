services:
  notediscovery:
    image: ghcr.io/gamosoft/notediscovery:latest
    container_name: notediscovery
    ports:
      - "8000:8000"
    volumes:
      # Required: Your notes
      - "/home/user/programas/library/CarpetaDeDocumentos:/app/data"
      # Optional: Uncomment to customize (file/folder must exist with content!)
      # - ./config.yaml:/app/config.yaml
      # - ./themes:/app/themes
      # - ./plugins:/app/plugins
      # - ./locales:/app/locales
    restart: unless-stopped
    environment:
      - TZ=UTC
      - MCP_ENABLED=true
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s

  mcpo-notediscovery: # union con Open-WebUI
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo-notediscovery
    ports:
      - "8001:8001"
    restart: unless-stopped
    command: --port 8001 --server-type streamable-http -- http://notediscovery:8000/mcp
    depends_on:
      - notediscovery
    networks:
      - default
