services:
  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    ports:
      - 25600:25600
    environment:
      - TZ=Europe/Madrid
      - SERVER_SERVLET_CONTEXT_PATH=/komga
      - "KOMGA_CORS_ALLOWED_ORIGINS=http://komga:25600, http://192.168.0.???:25600, http://192.168.0.???:80, http://192.168.0.???:8085, https://servidor.tailnet.ts.net:PuertoExternoKomga, https://servidor.tailnet.ts.net:PuertoExternoMangaBox, https://servidor.tailnet.ts.net:PuertoExternoKomf, https://servidor.tailnet.ts.net"
    volumes:
      - /home/user/programas/komga:/config
      - /home/user/programas/library:/data
  mangabox-server:
    image: nginx:alpine
    container_name: mangabox-web
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - /home/user/programas/mangabox:/usr/share/nginx/html:ro
  komf:
    image: sndxr/komf:latest
    container_name: komf
    restart: unless-stopped
    env_file:
      - /home/user/programas/credentials/komf/komf.env
    ports:
      - 8085:8085
    user: 1000:1000
    environment:
      # AL ESTAR EN EL MISMO STACK, SE COMUNICAN POR EL NOMBRE DEL CONTENEDOR
      - KOMF_KOMGA_BASE_URI=http://komga:25600/komga
      # !!! CAMBIA ESTO por tu usuario administrador real de Komga
      - KOMF_KOMGA_USER=REEMPLAZAR_CON_EMAIL
      - KOMF_LOG_LEVEL=INFO
      - JAVA_TOOL_OPTIONS=-XX:+UnlockExperimentalVMOptions -XX:+UseShenandoahGC -XX:ShenandoahGCHeuristics=compact -XX:ShenandoahGuaranteedGCInterval=3600000 -XX:TrimNativeHeapInterval=3600000
    volumes:
      # Ruta de tu servidor donde Komf guardará su configuración y base de datos interna
      - /home/user/programas/komf-config:/config
networks: {}
