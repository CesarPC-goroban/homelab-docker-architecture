services:
  arcane:
    image: arcane:subpath # es mi imagen personalizada
    container_name: arcane
    restart: unless-stopped
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/user/programas/arcane/data:/app/data
      - /home/user/programas:/app/data/projects
      - /app/data/projects/CarpetaConYml-YamlAExcluir  # <-- Añade esta línea (volumen anónimo vacío)
    env_file:
      - /home/user/programas/credentials/arcane/arcane.env
    environment:
      - ARCANE_TRUSTED_PROXIES=172.20.0.0/32,192.168.0.0/16
      - ARCANE_APP_URL=https://servidor.tailnet.ts.net/arcane/
#      - APP_URL=http://192.168.0.???:3552
      - ARCANE_PROJECTS_DIRECTORY=/app/data/projects
      - ARCANE_PROJECT_SCAN_SKIP_DIRS=DirctorioAExcluir
      - PUID=1000
      - PGID=1000

