services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/goroban/programas/syncthing/config:/var/syncthing/config
      - /home/goroban/programas/syncthing/data:/var/syncthing
    ports:
      - "8446:8384"       # Interfaz web en tu nuevo puerto 8446
      - "22000:22000/tcp" # Transferencia de archivos
      - "22000:22000/udp" # Transferencia de archivos QUIC
      - "21027:21027/udp" # Descubrimiento local
    restart: unless-stopped
