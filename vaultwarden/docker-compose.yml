services:
  vaultwarden:
    image: vaultwarden/server:latest # mi imagen personalizada
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true # Permite la sincronización instantánea con el móvil
      - TZ=Europe/Madrid
      - DOMAIN=https://servidor.tailnet.ts.net/vault/
    volumes:
      - /home/user/programas/vaultwarden/data:/data
    ports:
      - 80:80 # Lo abriremos en el puerto 80 de mi servidor
    networks:
      - npm-vaultwarden
networks:
  npm-vaultwarden:
    external: true