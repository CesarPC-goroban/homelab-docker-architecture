services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - /home/goroban/programas/paperless-ngx/redis:/data

  db:
    image: docker.io/library/postgres:16
    container_name: paperless-postgres
    restart: unless-stopped
    volumes:
      - /home/goroban/programas/paperless-ngx/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_db_pass
    secrets:
      - paperless_db_pass

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8445:8000"
    volumes:
      - /home/goroban/programas/paperless-ngx/data:/usr/src/paperless/data
      - /home/goroban/programas/paperless-ngx/media:/usr/src/paperless/media
      - /home/goroban/programas/paperless-ngx/export:/usr/src/paperless/export
      - /home/goroban/programas/paperless-ngx/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_db_pass
      PAPERLESS_OCR_LANGUAGE: spa
      PAPERLESS_TIME_ZONE: Europe/Madrid
      #PAPERLESS_FORCE_SCRIPT_NAME: /paperless
      PAPERLESS_URL: https://kraken.tail93dfe2.ts.net
      PAPERLESS_FORCE_SCRIPT_NAME: /paperless
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      # Clave secreta generada y segura inyectada correctamente:
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      #fiera_kraken_secret_key_token_2026_super_secure_string_64_bits
    secrets:
      - paperless_db_pass
      - paperless_secret_key

secrets:
  paperless_db_pass:
    file: /home/goroban/programas/credentials/paperless/db_pass.txt
  paperless_secret_key:
    file: /home/goroban/programas/credentials/paperless/secret_key.txt
