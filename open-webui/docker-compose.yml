services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "8121:8080"

    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"

    volumes:
      - ./data:/app/backend/data

    networks:
      - ia

networks:
  ia:
    external: true
