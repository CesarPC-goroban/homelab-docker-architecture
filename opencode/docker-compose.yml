services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.4.0
    container_name: opencode
    restart: unless-stopped
    ports:
      - "puerto:puerto"
    env_file:
      - /home/user/programas/credentials/opencode/opencode.env
    environment:
      # USER opencode
      - OPENCODE_SERVER_USERNAME=opencode
    volumes:
      - ./opencode-config:/root/.config/opencode
      - /home/user/programas/CarpetaDeProyectos:/CarpetaDeProyectos
    working_dir: /CarpetaDeProyectos
    command: ["serve", "--hostname", "0.0.0.0", "--port", "puerto"]
    # Todos los valores puerto son el mismo puerto elegido.
    # CarpetaDeProyectos debe ser igual en sus tres configuraciones, la carpeta elegida para tus proyectos