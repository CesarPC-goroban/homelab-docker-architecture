services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.4.0
    container_name: opencode
    restart: unless-stopped
    ports:
      - "8122:8122"
    env_file:
      - /home/goroban/programas/credentials/opencode/opencode.env
    environment:
      # USER opencode
      - OPENCODE_SERVER_USERNAME=opencode
    volumes:
      - ./opencode-config:/root/.config/opencode
      - /home/goroban/programas/workspace:/workspace
    working_dir: /workspace
    command: ["serve", "--hostname", "0.0.0.0", "--port", "8122"]
