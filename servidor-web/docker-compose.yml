services:
  nginx:
    image: nginx:alpine
    container_name: servidor-web-nginx
    ports:
      - "PuertoInicial-PuertoFinal:PuertoInicial-PuertoFinal"   # Puertos para cada Proyecto.
    volumes:
      - ./html:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - red-interna
    restart: unless-stopped

  php:
    image: php:8.3-fpm-alpine
    container_name: servidor-web-php
    # Si tus webs usan MySQL/MariaDB, instala la extensión mysqli y pdo_mysql al arrancar:
    command: sh -c "docker-php-ext-install mysqli pdo pdo_mysql && php-fpm"
    volumes:
      - ./html:/var/www/html
    secrets:
      - web_db_user
    depends_on:
      - db
    networks:
      - red-interna
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: servidor-web-db
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/web_db_root
      MARIADB_DATABASE: proyecto1_db # Valido solo la primera vez que haces un "docker compose up -d"
      MARIADB_USER: usuario_web      # Valido solo la primera vez que haces un "docker compose up -d"
      MARIADB_PASSWORD_FILE: /run/secrets/web_db_user
    secrets:
      - web_db_root
      - web_db_user
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - red-interna
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: servidor-web-phpmyadmin
    ports:
      - "80:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - red-interna
    restart: unless-stopped


networks:
  red-interna:
    driver: bridge

secrets:
  web_db_root:
    file: /home/user/programas/credentials/servidor-web/web_db_root.txt
  web_db_user:
    file: /home/user/programas/credentials/servidor-web/web_db_user.txt
