services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant-kraken:2026.11 # es mi imagen personalizada
    environment:
      HA_BASE_URL: /domo/
    volumes:
      - /home/user/programas/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    restart: unless-stopped
